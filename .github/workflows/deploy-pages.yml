name: Deploy interactive Shiny demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oncology-shiny-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'
          use-public-rspm: true
      - name: Install build system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libuv1-dev libarchive-dev
      - name: Install statistical and website dependencies
        run: |
          Rscript scripts/install_dependencies.R
          Rscript -e 'install.packages("shinylive", repos=Sys.getenv("RSPM")); stopifnot(requireNamespace("shinylive", quietly=TRUE))'
      - name: Validate statistical engine and exports
        run: Rscript scripts/validate.R
      - name: Build browser R Shiny app
        run: Rscript scripts/build_site.R
      - uses: actions/upload-pages-artifact@v3
        with:
          path: outputs/site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish verified website artifact
        id: deployment
        uses: actions/deploy-pages@v4
