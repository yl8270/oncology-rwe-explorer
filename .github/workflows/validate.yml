name: Synthetic statistical validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        r: ['4.4.3', 'release']
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      - name: Install Linux system dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libuv1-dev
      - name: Install explicit dependencies
        run: Rscript scripts/install_dependencies.R
      - name: Run statistical and Shiny server tests
        run: Rscript scripts/validate.R
      - name: Validate simulation truth
        run: Rscript scripts/validate_simulation.R
      - name: Run reproducible synthetic example
        run: Rscript scripts/run_example.R
